# /etc/turnserver.conf: coturn, el repetidor (TURN) del juego en red.
# Solo se usa cuando dos navegadores no consiguen conectarse directamente: entonces la imagen y
# el sonido del anfitrión pasan por aquí. instalar.sh pone el secreto; turn-ip.sh, las IP.

listening-port=3478
# IP local del servidor y la pública del router (dinámica): las pone y las actualiza turn-ip.sh
relay-ip=IP_LOCAL
external-ip=IP_PUBLICA/IP_LOCAL
# Puertos para repetir: el router los reenvía tal cual (mismo número fuera y dentro)
min-port=49160
max-port=49200

# Claves temporales: las da netplay.py (GET /turn) con este mismo secreto
use-auth-secret
static-auth-secret=SECRETO
realm=TU_DOMINIO
fingerprint

# Solo TURN por UDP y TCP en el 3478, sin TLS ni consola de administración
no-tls
no-dtls
no-tcp-relay
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute
no-multicast-peers

# Límites: unas pocas partidas a la vez, y como mucho unos 4 Mbit/s por conexión
user-quota=12
total-quota=60
max-bps=500000

# Solo repite hacia internet: nunca hacia la red local, redes privadas (CGNAT, VPN) ni el propio servidor
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Registro en el journal (journalctl -u coturn), sin detalle de cada paquete
syslog
simple-log
